{% extends "base.html" %}

{% block title %}刪除事件{% endblock %}

{% block content %}
<h1>確認刪除</h1>
<p>確定要刪除「{{ object.title }}」嗎？此操作無法復原。</p>
<form method="post" action="{% url 'incident_delete' object.pk %}" class="crud-form">
    {% csrf_token %}
    <button type="submit">確認刪除</button>
    <a href="{{ object.get_absolute_url }}">取消</a>
</form>
{% endblock %}
